name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]' -c requirements-tested.txt
      - run: ruff check . && ruff format --check . && pytest -q
      - run: python scripts/check_secrets.py
      - run: python scripts/evaluate.py --mode demo --output /tmp/demo-evaluation.json
      - run: docker build -t jev-inference-router:ci .
