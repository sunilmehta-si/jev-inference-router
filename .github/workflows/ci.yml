name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]' -c requirements-tested.txt
      - run: ruff check . && ruff format --check . && pytest -q
      - run: python scripts/check_secrets.py
      - run: python scripts/evaluate.py --mode demo --output /tmp/demo-evaluation.json
      - run: docker build -t jev-inference-router:ci .
