name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]' -c requirements-tested.txt
      - name: Check the tested dependencies against the OSV database
        # osv-scanner by checksum; a known vulnerability in a pinned version fails the build.
        env:
          OSV_SCANNER_VERSION: v2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile requirements.txt:requirements-tested.txt
      - run: ruff check . && ruff format --check . && pytest -q
      - run: python scripts/check_secrets.py
      - run: python scripts/evaluate.py --mode demo --output /tmp/demo-evaluation.json
      - run: docker build -t jev-inference-router:ci .
