[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-inference-router"
version = "0.1.0"
description = "Observable TypeSafe Jev routing for local GPU inference"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "typesafe-sdk>=0.7,<1", "python-dotenv>=1,<2", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["jev_router*"]

[tool.setuptools.package-data]
jev_router = ["static/*", "knowledge/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
